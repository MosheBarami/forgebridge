name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

# A force-push supersedes the run it interrupted; main is never cancelled so the
# default branch always has a complete, attributable result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Turborepo phones home for remote caching unless told not to. Promise 3 is
  # "no telemetry by default"; a project that leaks its own build metadata while
  # saying that has not earned the sentence.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # Runs first and fast. These gates turn written policy into a merge blocker,
  # and they need no build output, so a boundary violation fails in seconds
  # rather than after a full workspace build.
  gates:
    name: Repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Every `verify:*` script below runs through `tsx`, and the gate self-tests
      # run through `vitest`. Both are devDependencies, so this job needs an
      # install even though it needs no build output.
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          # The generated pydantic models are the third leg of the cross-language
          # drift proof, and `packages/sdk-python` supports 3.10+. Pinning the
          # oldest supported version here means a model that only parses on a
          # newer interpreter fails on the version the package claims to support.
          python-version: '3.10'

      - name: Install the Python SDK so the drift proof has all three legs
        run: python -m pip install -e "packages/sdk-python[dev]"

      - name: "Python SDK — lint and tests"
        working-directory: packages/sdk-python
        # Unlike `npm run lint`, this one is a real linter with a real config, so
        # it is named as a gate rather than as a placeholder.
        run: |
          python -m ruff check .
          python -m pytest

      - name: "Boundaries — protocol deps, no vendor SDK in core, neutral core, no app imports"
        run: npm run verify:boundaries

      - name: "Brand assets — provenance, checksums, nothing generated"
        run: npm run verify:assets

      # Promise 4 in README.md and GOVERNANCE.md says in as many words that this
      # runs in CI. A gate that exists but is never invoked would make that
      # sentence the same kind of unchecked claim the gate was written to stop,
      # so `scripts/__tests__/docs-claims.test.ts` asserts this step is here.
      - name: "Key custody — no credential-shaped field reaches storage (ADR-006, T1)"
        run: npm run verify:no-key-storage

      # ADR-013 is the one decision in this repository with no revisit trigger.
      # Its stated mitigation was a secret scan on the first commit and every
      # commit after; nothing ran until this step existed, which made the ADR's
      # own safety net the same kind of unchecked claim the other gates were
      # written to stop. `scripts/__tests__/docs-claims.test.ts` asserts this
      # step is here, and ADR-013 now names the check that actually runs.
      - name: "Publication — no secret-shaped or machine-local string in the tree (ADR-013)"
        run: npm run verify:no-secrets

      - name: Gate self-tests
        # A gate that cannot fail is decoration. These tests assert each rule
        # actually rejects a violating fixture.
        #
        # `scripts/__tests__/schema-projection.test.ts` runs here too, and its
        # Python leg needs an interpreter with pydantic. The step below installs
        # one so that leg is exercised rather than skipped — a skipped drift test
        # is indistinguishable from a passing one in a log.
        run: npx vitest run --dir scripts

      # TODO(M41): the Studio plugin has 187 Luau tests (`plugin/tests/run.luau`,
      # documented in plugin/BUILD.md) and nothing in CI runs them, so a change to
      # plugin/src is currently reviewed on a human's word that they still pass.
      # Adding the step needs a pinned Luau toolchain — the version and its
      # provenance are a decision for whoever owns the plugin's release, not
      # something to guess at here. Owner: plugin + M41.

  check:
    # Deliberately not named for lint. `npm run lint` runs below and is a no-op —
    # every package's script is an `echo` and no linter is configured (TODO(M04)).
    # A job title that reads "lint" would make a reviewer count a gate this repo
    # does not have.
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: "lint (placeholder — no linter configured, TODO(M04))"
        run: npm run lint

      - run: npm run test

      # The three cross-language projections of `packages/protocol` are generated
      # and committed (M08), so a schema edit that was never projected has to fail
      # somewhere. It fails here.
      #
      # Not in the **Repository gates** job with the other four `verify:*` scripts,
      # for one concrete reason: the generator reads the daemon's wire module for
      # the request and response shapes of the `/v1` surface, and that module
      # resolves `@forgebridge/protocol` through the workspace symlink — which
      # needs `packages/protocol/dist`. `npm run typecheck` above builds it, so
      # this step is placed after that and not before.
      - name: "Schema projection — JSON Schema, OpenAPI and pydantic models match the Zod contract"
        run: npm run verify:schemas

      - run: npm run build

      - name: Fail if the build wrote into the working tree
        # Generated artefacts ARE committed in this repository — M08 landed, and
        # `packages/protocol/schema/` and
        # `packages/sdk-python/src/forgebridge/models.py` are projections of the
        # Zod contract that live in the tree. This step is not what keeps them
        # fresh: `npm run build` is `tsc`, it does not run the generator, so a
        # stale projection produces no diff here. The staleness check is
        # `verify:schemas` above, which regenerates in memory and compares.
        #
        # What this step guards is the rest of the tree. Build output (`dist/`,
        # `.turbo/`, `*.tsbuildinfo`) is gitignored, so a clean tree after a
        # build is the expected state and a diff means something wrote where
        # nothing should: a build step writing back into `src/`, a task mutating
        # `package-lock.json`, or a new output path that nothing added to
        # `.gitignore` and that would otherwise start arriving in unrelated PRs
        # as noise. A diff under the generated paths reaches here too — but by
        # then `verify:schemas` has already failed, and that is the error to read.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The build modified tracked files. Commit the regenerated output."
            git status --porcelain
            git diff
            exit 1
          fi
