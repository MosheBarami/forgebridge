# The ForgeBridge self-hosting stack.
#
#     cp .env.example .env      # then set RELAY_DOMAIN in it
#     docker compose up -d
#     curl https://$RELAY_DOMAIN/v1/health
#
# `docs/SELF-HOSTING.md` is the long version, including what to do when one of
# these does not come up. This header is the short version, and the parts of it
# that are decisions rather than syntax.
#
# ── What is in here, and what is not ─────────────────────────────────────────
#
# Three services: the relay, TLS in front of it, and an OpenTelemetry collector.
#
# There is **no database**, and that is a decision rather than an omission. The
# relay holds session keys in memory and nowhere else, so a restart re-pairs
# every link — ten seconds per user, against a single file containing the
# material to forge a delivery to any of them. `apps/relay/README.md` states
# that trade under "What is not here". Adding Postgres to this file to make the
# stack look complete would either persist that material or persist nothing,
# and the second is decoration.
#
# The collector is here and reachable, and **nothing exports to it yet**. That
# is worth stating plainly rather than leaving for a reader to discover from an
# empty trace list: `@forgebridge/core` ships `telemetryFromEnvironment` and two
# adapters (M44), and no process in this repository calls them —
# `apps/relay/src/bin.ts` builds no telemetry port, and neither does
# `packages/daemon/src/bin.ts`. The collector is provisioned so that the first
# process wired to it needs a deployment change and not a new service; until
# then `docker compose logs otel-collector` shows a collector with nothing to
# collect, which is the true state of M44 in a deployment.
#
# ── Ports ────────────────────────────────────────────────────────────────────
#
# Only Caddy publishes. The relay is reachable through it and not otherwise,
# which is what makes RELAY_PROXY_HOPS=1 a fact rather than a hope: with the
# relay unpublished there is no path to it that skips the proxy, so the
# rightmost X-Forwarded-For entry really was written by Caddy.

name: forgebridge

services:
  relay:
    build:
      # The repository root: the relay depends on @forgebridge/protocol, a
      # workspace sibling a build rooted at apps/relay could not see.
      context: .
      dockerfile: apps/relay/Dockerfile
    restart: unless-stopped
    environment:
      RELAY_PORT: 8080
      # ONE trusted proxy: caddy, below. This is the number that decides whether
      # X-Forwarded-For and X-Forwarded-Proto are evidence or decoration.
      # Leaving it at 0 makes the relay refuse every request rather than believe
      # a header any client can set, which is the correct failure but not the
      # one you want in production.
      RELAY_PROXY_HOPS: 1
      RELAY_ALLOWED_ORIGINS: ${RELAY_ALLOWED_ORIGINS:-}
      RELAY_CONTROL_TOKEN: ${RELAY_CONTROL_TOKEN:-}
      RELAY_SPONSORED_DAILY_BUDGET: ${RELAY_SPONSORED_DAILY_BUDGET:-200}
      RELAY_MAX_CHANGESET_BYTES: ${RELAY_MAX_CHANGESET_BYTES:-1048576}
      RELAY_MAX_OPERATIONS: ${RELAY_MAX_OPERATIONS:-200}
      # Read by @forgebridge/core's telemetryFromEnvironment. Set here so that
      # the day a process in this repository constructs a telemetry port, this
      # deployment is already pointing it at the collector below. Nothing reads
      # it today — see the note in this file's header.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: forgebridge-relay
    expose:
      - "8080"
    depends_on:
      otel-collector:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - relay
    environment:
      # Caddy provisions a certificate for this name automatically, and issues
      # one from its own local CA when the name is `localhost` — which is what
      # makes `RELAY_DOMAIN=localhost docker compose up` a real end-to-end test
      # of this file rather than a special case that skips the proxy.
      #
      # ADR-004 requires a single hostname: Roblox grants plugin HTTP permission
      # per web address, so a per-tenant subdomain would ask every user to
      # approve another one.
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in .env to the hostname this relay serves (use "localhost" to try it locally)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  otel-collector:
    # Pinned. `latest` on a collector means the processor pipeline can change
    # under a deployment nobody touched.
    image: otel/opentelemetry-collector-contrib:0.159.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel/config.yaml:ro
    expose:
      - "4317"   # OTLP/gRPC
      - "4318"   # OTLP/HTTP — the protocol `otlpTelemetry` in @forgebridge/core speaks
    # Not published to the host. An OTLP receiver on a public interface accepts
    # spans from anyone who finds it.

volumes:
  caddy-data:
  caddy-config:
